<!DOCTYPE html>

	<link rel="shortcut icon" href="../../assets/img/Header/favicon.ico" type="image/x-icon">
<script>
  try {
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}

  document.addEventListener('DOMContentLoaded', function () {
    try {
      if (localStorage.getItem('theme') === 'dark' && document.body) {
        document.body.classList.add('dark');
      }
    } catch (e) {}
  });
</script>
<style>html:not(.ready){visibility:hidden;}</style>
<link rel="stylesheet" type="text/css" href="../../assets/libs/font-awesome-4.7.0/css/font-awesome.min.css">

<main>

				<!-- Список сотрудников -->

</main>

			</div>
			<div class="inf-box"></div>
		</div>
	</div>
</footer>

<script>
	function getCookie(name) {
		let matches = document.cookie.match(new RegExp(
			"(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
		));
		return matches ? decodeURIComponent(matches[1]) : undefined;
	};
	try {
		let Theme = 'light';
		if (new RegExp(/Firefox/i).test(navigator.userAgent)) {
			Theme = getCookie('theme');
		} else if (new RegExp(/Chrome/i).test(navigator.userAgent)) {
			Theme = localStorage.getItem('theme');
		};
		if (Theme === 'dark') {
			document.querySelector('body').classList.add('dark');
		} else {
			document.querySelector('body').classList.remove('dark');
		};
	} catch (error) {
		console.error('Не удалось установить тему:', error);
	};
</script>

<script>
	window.addEventListener('load', function() {
		try {
			var state = (typeof State !== 'undefined' && State) ? State : null;
			if (state) {
				var deptCount = Object.keys(state).length;
				var staffCount = 0;
				for (var key in state) staffCount += Object.keys(state[key].staff || {}).length;
				var deptCountEl = document.querySelector('#dept_count');
				if (deptCountEl && deptCount > 0) deptCountEl.textContent = '• ' + deptCount + ' подразделений';
				var heroStaff = document.querySelector('#hero_staff_count');
				var heroDept = document.querySelector('#hero_dept_count');
				if (heroStaff) heroStaff.textContent = staffCount.toLocaleString('ru-RU');
				if (heroDept) heroDept.textContent = deptCount;
			}
		} catch(e) {}
	});
</script>
